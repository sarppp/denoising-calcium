# ────────────────────────────────────────────────────────────────────────────
# N2V3D large — ~4M params (base_ch=32, depth=4)
#
# TWO MODES — change the marked lines depending on what you're running:
#
#   MODEL SIZE TEST (L40S, 10 epochs, fast comparison):
#     data.patch:         [64, 64, 64]
#     data.stride:        [16, 32, 32]
#     data.batch_size:    32
#     training.epochs:    10
#     training.grad_ckpt: false   ← L40S has enough VRAM even for large
#
#   FULL TRAINING (L40S, inference on T4):
#     data.patch:         [128, 128, 128]
#     data.stride:        [32, 64, 64]
#     data.batch_size:    16
#     training.epochs:    100
#     training.grad_ckpt: false   ← still fine on L40S
#     inference.tile:     [128, 128, 128]
#     inference.overlap:  [32, 16, 16]
#
# grad_accum: 1 for both — L40S has enough VRAM.
# ────────────────────────────────────────────────────────────────────────────

name: n2v3d_large

model:
  name: n2v3d
  kwargs:
    in_ch:    1
    base_ch:  32                         # 2× base → ~4M params (8× more than base)
    depth:    4                          # extra resolution level; wider bottleneck
    kernel:   3
    pool:     2

# ─── data ───────────────────────────────────────────────────────────────────
data:
  patch:       [128, 128, 128]          # FULL TRAINING ✅ (was [64,64,64] for model size test)
  stride:      [32, 64, 64]             # FULL TRAINING ✅ (was [16,32,32])
  batch_size:  16
  num_workers: 4
  samples_per_epoch: 4000               # 4000÷16=250 steps/epoch
  train_stacks: [A1, B1, C2, D2]
  ref_stack:   F0
  val_stacks:  [F1, F2, F3]
  gain_aug: { enabled: true, log_uniform_range: [20.0, 2000.0], prob: 0.5 }
  flip: true
  rot90: true
  temporal_reverse: true

# ─── training ───────────────────────────────────────────────────────────────
training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_restarts
  restarts: 3
  epochs: 100                           # FULL TRAINING ✅ (was 10 — early stopping decides actual endpoint)
  warmup_steps: 500
  grad_clip: 1.0
  grad_accum: 1                          # batch=16 native — no accumulation needed
  grad_ckpt: false                      # H200 141GB has headroom — peak=72.77GiB without it, ~95GB without
  ema_decay: 0.999
  amp: true
  seed: 0
  log_every: 50
  ckpt_every: 5
  early_stop: { metric: stsnr_val, patience: 10, higher_is_better: true }
  # patience=10 (not 5): cosine restarts fire at epochs ~33 and ~67 (T_0 = 25000÷3 = 8333 steps).
  # patience=5 can fire during the end-of-cycle plateau or post-restart dip before the model
  # recovers into the next cycle. patience=10 covers one full valley safely.
  # Also protects against non-monotonic F3 improvement early in training as the model
  # adjusts to high-gain gradients at full weight (per-sample gain fix).

# ─── loss ───────────────────────────────────────────────────────────────────
loss:
  name: huber                           # ✅ winner from ablation
  var_floor: 1.0
  huber_delta: 1.0                      # default=1.0 in config.py — safe to omit, but explicit is clearer
  aux: {}

# ─── inference ──────────────────────────────────────────────────────────────
inference:
  tile:    [128, 128, 128]              # FULL TRAINING ✅ (was [64,64,64] — matches training patch)
  overlap: [32, 16, 16]                 # FULL TRAINING ✅ (was [16,16,16] — larger T overlap for longer tile)
  tta:
    rotations: 1
    flips: false
