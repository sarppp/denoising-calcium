# ────────────────────────────────────────────────────────────────────────────
# N2V3D large — ~4M params (base_ch=32, depth=4)
#
# TWO MODES — change the marked lines depending on what you're running:
#
#   MODEL SIZE TEST (L40S, 10 epochs, fast comparison):
#     data.patch:         [64, 64, 64]
#     data.stride:        [16, 32, 32]
#     data.batch_size:    32
#     training.epochs:    10
#     training.grad_ckpt: false   ← L40S has enough VRAM even for large
#
#   FULL TRAINING (L40S, inference on T4):
#     data.patch:         [128, 128, 128]
#     data.stride:        [32, 64, 64]
#     data.batch_size:    16
#     training.epochs:    100
#     training.grad_ckpt: false   ← still fine on L40S
#     inference.tile:     [128, 128, 128]
#     inference.overlap:  [32, 16, 16]
#
# grad_accum: 1 for both — L40S has enough VRAM.
# ────────────────────────────────────────────────────────────────────────────

name: n2v3d_large

model:
  name: n2v3d
  kwargs:
    in_ch:    1
    base_ch:  32                         # 2× base → ~4M params (8× more than base)
    depth:    4                          # extra resolution level; wider bottleneck
    kernel:   3
    pool:     2

# ─── data ───────────────────────────────────────────────────────────────────
data:
  patch:       [64, 64, 64]             # MODEL SIZE TEST — change to [128,128,128] for full training
  stride:      [16, 32, 32]             # MODEL SIZE TEST — change to [32,64,64] for full training
  batch_size:  32                       # MODEL SIZE TEST — change to 16 for full training
  num_workers: 4
  samples_per_epoch: 2000
  train_stacks: [A1, B1, C2, D2]
  ref_stack:   F0
  val_stacks:  [F1, F2, F3]
  gain_aug: { enabled: true, log_uniform_range: [20.0, 2000.0], prob: 0.5 }
  flip: true
  rot90: true
  temporal_reverse: true

# ─── training ───────────────────────────────────────────────────────────────
training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_restarts
  restarts: 3
  epochs: 10                            # MODEL SIZE TEST — change to 100 for full training
  warmup_steps: 500
  grad_clip: 1.0
  grad_accum: 1                         # L40S: always 1
  grad_ckpt: false                      # L40S: not needed even for large model
  ema_decay: 0.999
  amp: true
  seed: 0
  log_every: 50
  ckpt_every: 5
  early_stop: { metric: stsnr_val, patience: 5, higher_is_better: true }

# ─── loss ───────────────────────────────────────────────────────────────────
loss:
  name: huber                           # ✅ winner from ablation
  var_floor: 1.0
  huber_delta: 1.0                      # default=1.0 in config.py — safe to omit, but explicit is clearer
  aux: {}

# ─── inference ──────────────────────────────────────────────────────────────
inference:
  tile:    [64, 64, 64]                 # MODEL SIZE TEST — change to [128,128,128] for full training
  overlap: [16, 16, 16]                 # MODEL SIZE TEST — change to [32,16,16] for full training
  tta:
    rotations: 4
    flips: true
