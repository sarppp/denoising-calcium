# Same as ablation_nll.yaml except loss.name = anscombe_mse.
#
# Anscombe MSE rationale:
#   The Anscombe transform z = (2/g) * sqrt(g*y + 3/8*g² + σ²) maps
#   Poisson-Gaussian noise to approximately unit variance — so MSE in
#   this space weights all signal levels equally, unlike raw MSE which
#   under-weights high-intensity voxels.
#
#   Crucially, this is principled even when the Poisson-Gaussian noise model
#   is only partially correct (R²=0.27 on A1/B1). The transform stabilises
#   variance without requiring the NLL to converge under a misspecified model.
#   It is a strict improvement over raw MSE and more stable than NLL when the
#   noise model is uncertain.
#
#   nb10 showed R²≈0.001-0.24 for ALL val stacks — anscombe_mse is the loss
#   best suited to this regime: it encodes the right inductive bias (noise
#   grows with signal) without betting everything on an exact g and σ.
#
# NOTE: anscombe_mse was BROKEN in earlier versions — it computed plain MSE
#   because pred/tgt are passed in raw ADU. Fixed in this commit: the forward
#   Anscombe transform is now applied inside _simple_loss before computing MSE.
#
# Compare against other ablations via:
#   python scripts/ablation_verdict.py runs/nll runs/mse runs/mae runs/anscombe_mse runs/huber
name: ablation_anscombe_mse

model:
  name: n2v3d
  kwargs: { in_ch: 1, base_ch: 12, depth: 3, kernel: 3, pool: 2 }

data:
  patch:       [64, 64, 64]
  stride:      [16, 32, 32]
  batch_size:  8
  num_workers: 4
  samples_per_epoch: 2000
  train_stacks: [A1, B1]
  ref_stack:   F0
  val_stacks:  [F1, F2, F3]       # noisy stacks scored against ref_stack; F3=OOD Task-2
  gain_aug: { enabled: true, log_uniform_range: [20.0, 2000.0], prob: 0.5 }
  flip: true
  rot90: true
  temporal_reverse: true

training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_restarts
  restarts: 1
  epochs: 10
  warmup_steps: 100
  grad_clip: 1.0
  grad_accum: 1
  grad_ckpt: false
  ema_decay: 0.999
  amp: true
  seed: 0
  log_every: 20
  ckpt_every: 2
  early_stop: { metric: stsnr_val, patience: 5, higher_is_better: true }

loss:
  name: anscombe_mse             # MSE in Anscombe (unit-variance) space
  var_floor: 1.0
  huber_delta: 1.0               # unused here; present for schema consistency
  aux: {}

inference:
  tile: [64, 64, 64]
  overlap: [16, 16, 16]
  tta: { rotations: 1, flips: false }
