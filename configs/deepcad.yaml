# DeepCAD: 3-D U-Net trained with temporal Noise2Noise (odd/even frame split).
# Schema identical to n2v3d.yaml.
name: deepcad_v1

model:
  name: deepcad
  kwargs:
    in_ch:   1
    base_ch: 16
    depth:   3
    kernel:  3
    pool:    2

data:
  patch:       [32, 128, 128]            # will be split into 2×(16, H, W) odd/even
  stride:      [8, 64, 64]
  batch_size:  16
  num_workers: 4
  train_stacks: [A1, B1, C2, D2]
  ref_stack:   F0
  val_stacks:  [F1, F2, F3]
  gain_aug: { enabled: true, log_uniform_range: [20.0, 2000.0], prob: 0.5 }
  flip:             true
  rot90:            true
  temporal_reverse: true

training:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine_restarts
  restarts: 3
  epochs: 50
  warmup_steps: 500
  grad_clip: 1.0
  ema_decay: 0.999
  amp: true
  seed: 0
  log_every: 50
  ckpt_every: 1
  early_stop: { metric: stsnr_val, patience: 5, higher_is_better: true }

loss:
  name: mse                              # DeepCAD trains with MSE on paired halves
  var_floor: 1.0
  aux: {}

inference:
  tile:    [32, 128, 128]
  overlap: [8, 16, 16]
  tta:     { rotations: 4, flips: true }
