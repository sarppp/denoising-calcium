# ────────────────────────────────────────────────────────────────────────────
# CIDC25 — canonical config schema. Uncomment / change values to switch
# between any of the 5 models: deepinterp | n2v3d | deepcad | mamba3d | pinn
#
# All configs share this exact schema. Unknown keys are REJECTED at load
# time (typo safety). Other configs (deepinterp.yaml, mamba3d.yaml, ...)
# differ only in `model.name` and `model.kwargs`; this file documents
# every knob once.
# ────────────────────────────────────────────────────────────────────────────

name: n2v3d_v1                           # free-form run id (ckpts, logs)

# ─── model ──────────────────────────────────────────────────────────────────
model:
  name: n2v3d                            # deepinterp | n2v3d | deepcad | mamba3d | pinn
  kwargs:
    # Common 3-D U-Net knobs (n2v3d, deepcad, mamba3d):
    in_ch:    1
    base_ch:  16                         # channels at level 0; doubles each level
    depth:    3                          # number of resolution levels
    kernel:   3
    pool:     2

    # ── deepinterp-specific (uncomment if model.name: deepinterp) ──────────
    # half_context: 6                    # K; input is (B, 2K, H, W)

    # ── mamba3d-specific (uncomment if model.name: mamba3d) ────────────────
    # d_state:       16                  # SSM hidden state dim per channel
    # d_conv:         4                  # local 1-D causal conv width
    # expand:         2                  # inner expansion factor in Mamba block
    # n_layers:       2                  # bi-directional Mamba blocks at bottleneck
    # bidirectional:  true

    # ── pinn-specific (uncomment if model.name: pinn) ──────────────────────
    # backbone:
    #   name: n2v3d                      # any of deepinterp|n2v3d|deepcad|mamba3d
    #   kwargs: { in_ch: 1, base_ch: 16, depth: 3, kernel: 3, pool: 2 }
    # tau_range:    [5.0, 200.0]         # clamp range for per-pixel τ (frames)
    # baseline_from: head                # 'head' | 'median'

# ─── data ───────────────────────────────────────────────────────────────────
data:
  patch:       [64, 128, 128]            # [T, H, W] — T=64 > τ₀.₅=46 (nb01); T=32 was too short
  stride:      [16, 64, 64]              # patch stride over each stack
  batch_size:  8             # 8 × grad_accum=2 → effective batch 16; fits T4 at [64,128,128]
  num_workers: 4
  samples_per_epoch: 2000   # 2000÷8=250 steps/epoch; 100 epochs ≈ ~8h on T4
  train_stacks: [A1, B1, C2, D2]         # train only on training stacks
  ref_stack:   F0                          # clean ground truth — scored against, never trained on
  val_stacks:  [F1, F2, F3]               # noisy stacks; F3=OOD Task-2 (gain≈991)
  gain_aug:
    enabled:           true
    log_uniform_range: [20.0, 2000.0]    # covers level-1..3 and beyond (F3 = 991)
    prob:              0.5               # fraction of batches to resample noise
  flip:             true
  rot90:            true
  temporal_reverse: true

# ─── training ───────────────────────────────────────────────────────────────
training:
  optimizer:     adamw
  lr:            3.0e-4
  weight_decay:  1.0e-4
  scheduler:     cosine_restarts
  restarts:      3
  epochs:        100
  warmup_steps:  500
  grad_clip:     1.0
  grad_accum:    2                       # effective_batch = 8 × 2 = 16; reduces peak VRAM vs batch=16
  grad_ckpt:     false                   # trade compute for memory on small GPUs
  ema_decay:     0.999
  amp:           true                    # mixed-precision (bf16 where possible)
  seed:          0
  log_every:     50
  ckpt_every:    1
  early_stop:
    metric:            stsnr_val
    patience:          5
    higher_is_better:  true

# ─── loss ───────────────────────────────────────────────────────────────────
loss:
  name: poisson_gaussian_nll             # poisson_gaussian_nll | anscombe_mse | mse
  var_floor: 1.0
  aux:                                   # dict of name -> { enabled, weight, extras }
    pinn:
      enabled: false                     # only meaningful for model.name: pinn
      weight:  0.01
      extras:
        sparsity_l1:    0.005            # λ on |s(t)| (0.001–0.01 recommended)
        ode_dt:         1.0              # frame
        detach_input:   false            # if true: reconstruct from denoised.detach()
    deepinterp:
      enabled: false                     # N2V-3D + DeepInterp dual-supervision
      weight:  0.5
      extras:
        drop_center_prob: 0.1            # fraction of batches with centre-frame drop

# ─── inference ──────────────────────────────────────────────────────────────
inference:
  tile:    [64, 128, 128]                # match data.patch
  overlap: [16, 16, 16]                  # must divide tile evenly-ish
  tta:
    rotations: 4                         # 4 × 90° rotations in H×W → 4 augmentations
    flips:     true                      # also flip H → 4×2 = 8 augmentations (D4 group)
