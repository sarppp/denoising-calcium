[project]
name = "denoising-calcium"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cuda-python>=12.3",
    "torch",
    "torchvision",
    "torchaudio",
    "numpy<2.0",
    "librosa",
    "tifffile",
    "matplotlib",
    "scipy",
    "jupyter",
    "ipykernel",
    "tqdm",
    "marimo>=0.23.1",
    "mcp>=1.27.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "playwright>=1.58.0",
    "pyyaml>=6.0",
    "einops>=0.8.0",
    "modal>=0.73",
]

[project.optional-dependencies]
# CUDA-only: Mamba selective SSM kernels. Install on the GPU box with
#     uv pip install -e '.[mamba]'
# Requires nvcc in PATH at build time.
mamba = [
    "mamba-ssm>=2.2.2,<2.3.0",
    "causal-conv1d>=1.4.0",
]

[project.scripts]
cidc = "cidc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cidc"]

[tool.uv]
no-binary-package = ["mamba-ssm", "causal-conv1d"]
no-build-isolation-package = ["mamba-ssm", "causal-conv1d"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch      = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio  = { index = "pytorch-cu124" }
